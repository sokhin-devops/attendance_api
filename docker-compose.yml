services:
  postgres:
    image: postgres:16-alpine
    container_name: attendance-postgres
    environment:
      POSTGRES_DB: attendance_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: underadmin
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - attendance-pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/10-init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d attendance_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: attendance-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Inside the compose network the database host is the service name.
      DB_URL: jdbc:postgresql://postgres:5432/attendance_db
      DB_USERNAME: postgres
      DB_PASSWORD: underadmin
      APP_JWT_SECRET: change-me-in-production-a-very-long-dev-only-secret-key-32b+
      APP_CORS_ORIGINS: http://localhost:4200
      APP_SEED_ENABLED: "true"
    ports:
      - "8080:8080"
    # Opt in with:  docker compose up --build api
    profiles: ["api"]

volumes:
  attendance-pgdata:
