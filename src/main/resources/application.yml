server:
  port: 8081

spring:
  application:
    name: attendance-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/attendance_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:underadmin}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    # Override in production via APP_JWT_SECRET. Must be >= 32 bytes for HS256.
    secret: ${APP_JWT_SECRET:change-me-in-production-a-very-long-dev-only-secret-key-32b+}
    access-token-minutes: ${APP_JWT_ACCESS_MINUTES:15}
    refresh-token-days: ${APP_JWT_REFRESH_DAYS:7}
    issuer: attendance-api
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:4200,http://localhost:8080,http://localhost:3000}
  seed:
    # Creates the bootstrap platform super admin on first start if no user exists.
    enabled: ${APP_SEED_ENABLED:true}
    super-admin-email: ${APP_SEED_EMAIL:superadmin@attendance.local}
    super-admin-password: ${APP_SEED_PASSWORD:SuperAdmin@123}
  notifications:
    retention-days: 90
  fcm:
    # Phase 2 stub: when disabled, push sends are logged instead of dispatched.
    enabled: ${APP_FCM_ENABLED:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.attendance.api: DEBUG
    org.hibernate.SQL: WARN
